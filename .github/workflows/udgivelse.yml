# Når versionsnummeret i udvidelse/manifest.json ændres på main, pakkes udvidelsen som zip
# og lægges ud som udgivelse (med tag vX.Y.Z). Kan også startes i hånden under Actions.
name: Udgivelse
on:
  push:
    branches: [main]
    paths: ['udvidelse/manifest.json', '.github/workflows/udgivelse.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  udgiv:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Find version
        run: |
          V=$(jq -r .version udvidelse/manifest.json)
          echo "V=$V" >> "$GITHUB_ENV"
          if gh release view "v$V" >/dev/null 2>&1; then echo "FINDES=1" >> "$GITHUB_ENV"; echo "v$V er allerede udgivet"; fi
      - name: Pak zip
        if: env.FINDES != '1'
        run: |
          mkdir -p dist/NFClibra-hjaelper && cp udvidelse/* dist/NFClibra-hjaelper/
          cd dist && zip -qr "NFClibra-hjaelper-$V.zip" NFClibra-hjaelper
      - name: Lav udgivelse
        if: env.FINDES != '1'
        run: |
          awk -v v="## $V" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > noter.md
          printf '\n**Installation:** pak zip-filen ud til en mappe, der får lov at blive liggende → `chrome://extensions` eller `edge://extensions` → slå Udviklertilstand til → Indlæs upakket → vælg mappen → genindlæs Cicero.\n' >> noter.md
          gh release create "v$V" "dist/NFClibra-hjaelper-$V.zip" --target "$GITHUB_SHA" --title "NFClibra-hjælper $V" --notes-file noter.md
