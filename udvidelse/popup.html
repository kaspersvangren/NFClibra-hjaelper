<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>NFClibra-hjælper</title>
<style>
  :root { --bg: #fff; --fg: #1f1f1f; --muted: #6b6b6b; --line: #e3e3e3; --on: #1976d2; --off: #b8b8b8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #242424; --fg: #ececec; --muted: #a0a0a0; --line: #3a3a3a; --on: #4a9eff; --off: #5a5a5a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 330px; background: var(--bg); color: var(--fg);
    font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
  header img { width: 28px; height: 28px; }
  header b { font-size: 15px; display: block; }
  header span { color: var(--muted); font-size: 12px; }
  h2 { margin: 10px 16px 2px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  label { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 8px 16px; cursor: pointer; }
  label:hover { background: rgba(127,127,127,.08); }
  .t small { display: block; color: var(--muted); font-size: 12px; }
  kbd { font: 600 11px ui-monospace, Consolas, monospace; padding: 0 4px; border-radius: 3px;
    background: rgba(127,127,127,.18); }
  input { position: absolute; opacity: 0; pointer-events: none; }
  .sw { flex: none; width: 34px; height: 20px; border-radius: 10px; background: var(--off); position: relative;
    transition: background .15s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%;
    background: #fff; transition: transform .15s; }
  input:checked + .sw { background: var(--on); }
  input:checked + .sw::after { transform: translateX(14px); }
  input:focus-visible + .sw { outline: 2px solid var(--on); outline-offset: 2px; }
  .ny { display: none; margin: 0 16px 6px; padding: 9px 11px; border-radius: 8px; background: rgba(25,118,210,.12); }
  .ny a { color: var(--on); font-weight: 600; }
  .tjek { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 2px 16px 8px; color: var(--muted); font-size: 12px; }
  .tjek button { border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); padding: 3px 8px; font: inherit; cursor: pointer; }
  footer { margin-top: 8px; padding: 10px 16px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <img src="ikon48.png" alt="">
  <div><b>NFClibra-hjælper</b><span id="ver"></span></div>
</header>
<div class="ny" id="ny"></div>

<h2>Musen</h2>
<label><span class="t">QR ved lånernummer<small>Til NFClibras kamera i Låner-feltet</small></span>
  <input type="checkbox" data-k="qrLaaner"><span class="sw"></span></label>
<label><span class="t">QR ved CQL-linjen<small>Til NFClibras CQL-kamera</small></span>
  <input type="checkbox" data-k="qrCql"><span class="sw"></span></label>
<label><span class="t">Store forsider<small>Når musen holdes over en lille forside</small></span>
  <input type="checkbox" data-k="forsider"><span class="sw"></span></label>

<h2>Materialevalg</h2>
<label><span class="t">Beholdning ved bestilling<small>Eks., hjemme, udlånt, bestilt og res. ved Bestillingsoplysninger</small></span>
  <input type="checkbox" data-k="beholdning"><span class="sw"></span></label>

<h2>Privatliv</h2>
<label><span class="t">Skjul CPR-numre<small>Prikker når man taster, ellers 311210-****. Hold øjet nede for at se</small></span>
  <input type="checkbox" data-k="skjulCpr"><span class="sw"></span></label>

<h2>Tastatur</h2>
<label><span class="t">Ctrl + mus: kopiér felt<small>Hold <kbd>Ctrl</kbd>, peg, tryk <kbd>C</kbd></small></span>
  <input type="checkbox" data-k="kopier"><span class="sw"></span></label>
<label><span class="t"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> gennemfører<small>Udlån, aflevering og reservation</small></span>
  <input type="checkbox" data-k="ctrlEnter"><span class="sw"></span></label>
<label><span class="t">Træk med <kbd>Ctrl</kbd>+<kbd>Shift</kbd><small><kbd>L</kbd> låner · <kbd>M</kbd> materiale · <kbd>B</kbd> katalog · <kbd>R</kbd> reservér</small></span>
  <input type="checkbox" data-k="traek"><span class="sw"></span></label>

<h2>Opdateringer</h2>
<label><span class="t">Tjek for nye versioner<small>Spørger GitHub højst hver 6. time og viser en besked i Cicero</small></span>
  <input type="checkbox" data-k="tjekOpdatering"><span class="sw"></span></label>
<div class="tjek"><span id="status"></span><button type="button" id="tjeknu">Tjek nu</button></div>

<footer>Ændringer virker med det samme i Cicero. Udvidelsen læser kun det, der står på siden, og sender intet fra Cicero videre. Den spørger kun GitHub om nyeste version.</footer>
<script src="popup.js"></script>
</body>
</html>
